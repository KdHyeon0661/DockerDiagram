name: quality

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DockerDiagram.slnx

      - name: Build
        run: dotnet build DockerDiagram.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >-
          dotnet test DockerDiagram/Tests/DockerDiagram.Tests.csproj
          --configuration Release
          --no-build
          --collect "Code Coverage"
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: DockerDiagram/Tests/TestResults
